[project]
name = "realesrgan"
version = "0.3.0"
description = "Real-ESRGAN image and video super-resolution"
requires-python = ">=3.12"
dependencies = [
    "basicsr>=1.4.2",
    "facexlib>=0.2.5",
    "ffmpeg-python",
    "gfpgan>=1.3.5",
    "numpy",
    "opencv-python",
    "Pillow",
    "torch>=2.0",
    "torchvision",
    "tqdm",
]

[dependency-groups]
dev = [
    "autopep8",
]

[tool.autopep8]
max_line_length = 88
aggressive = 1